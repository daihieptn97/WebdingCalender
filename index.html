<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Lich Cuoi Hoi - Xem ngay gio dep</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg-cream: #faf6f2;
			--rose: #e8c5c5;
			--ink-brown: #5c4033;
			--gold-soft: #d4af7a;
			--card: #fffdfa;
			--ok: #2f6f52;
			--warn: #a86d2b;
			--bad: #a03d3d;
			--muted: #7d6458;
			--line: #ecd9cd;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Inter", "Segoe UI", sans-serif;
			color: var(--ink-brown);
			background:
				radial-gradient(circle at 8% 10%, #f4e5d8 0%, transparent 38%),
				radial-gradient(circle at 92% 18%, #efd9d9 0%, transparent 32%),
				linear-gradient(150deg, #faf6f2 0%, #f8f0ea 45%, #fdf8f3 100%);
			min-height: 100vh;
			line-height: 1.5;
		}

		.wrap {
			max-width: 760px;
			margin: 0 auto;
			padding: 32px 16px 56px;
		}

		.hero {
			margin-bottom: 18px;
			border: 1px solid var(--line);
			background: linear-gradient(135deg, rgba(232, 197, 197, 0.32), rgba(250, 246, 242, 0.95));
			border-radius: 18px;
			padding: 22px 20px;
			box-shadow: 0 12px 28px rgba(92, 64, 51, 0.08);
		}

		h1 {
			margin: 0;
			font-family: "Playfair Display", Georgia, serif;
			font-size: clamp(28px, 4.6vw, 40px);
			line-height: 1.12;
			letter-spacing: 0.2px;
		}

		.subtitle {
			margin-top: 8px;
			color: var(--muted);
			font-size: 15px;
		}

		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 16px;
			box-shadow: 0 8px 22px rgba(92, 64, 51, 0.06);
			padding: 18px;
			margin-top: 14px;
		}

		form {
			display: grid;
			gap: 14px;
		}

		.input-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 12px;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: 600;
			margin-bottom: 6px;
			color: var(--muted);
		}

		input[type="date"] {
			width: 100%;
			border: 1px solid #d8c2b4;
			border-radius: 12px;
			padding: 10px 12px;
			font-size: 15px;
			background: #fff;
			color: var(--ink-brown);
			outline: none;
			transition: border-color 0.2s ease, box-shadow 0.2s ease;
		}

		input[type="date"]:focus {
			border-color: var(--gold-soft);
			box-shadow: 0 0 0 3px rgba(212, 175, 122, 0.2);
		}

		button {
			border: 0;
			border-radius: 999px;
			padding: 11px 16px;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 0.2px;
			color: #fffaf6;
			background: linear-gradient(135deg, #8f5f46, #6f4330);
			cursor: pointer;
			transition: transform 0.12s ease, box-shadow 0.2s ease;
		}

		button:hover {
			transform: translateY(-1px);
			box-shadow: 0 10px 18px rgba(92, 64, 51, 0.2);
		}

		.result-shell {
			display: none;
			opacity: 0;
			transform: translateY(10px);
		}

		.result-shell.show {
			display: block;
			animation: reveal 0.5s ease forwards;
		}

		@keyframes reveal {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.grade {
			display: grid;
			gap: 6px;
			padding: 16px;
			border-radius: 14px;
			border: 1px solid var(--line);
			background: linear-gradient(135deg, #fff8f1, #fff);
		}

		.grade h2 {
			margin: 0;
			font-family: "Playfair Display", Georgia, serif;
			font-size: 28px;
			line-height: 1.15;
		}

		.point-line {
			font-weight: 700;
			color: var(--ink-brown);
		}

		.tag {
			display: inline-block;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 700;
			padding: 4px 10px;
		}

		.tag.ok {
			color: var(--ok);
			background: #e4f4ed;
		}

		.tag.warn {
			color: var(--warn);
			background: #f7ecdb;
		}

		.tag.bad {
			color: var(--bad);
			background: #f7e3e3;
		}

		details {
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 10px 12px;
			background: #fff;
			margin-top: 10px;
		}

		summary {
			cursor: pointer;
			font-weight: 700;
			color: var(--ink-brown);
		}

		.detail-body {
			margin-top: 10px;
			color: var(--muted);
			font-size: 14px;
			white-space: pre-line;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
			border-radius: 12px;
			overflow: hidden;
			border: 1px solid var(--line);
		}

		th,
		td {
			padding: 9px 10px;
			text-align: left;
			border-bottom: 1px solid #f3e5da;
			font-size: 14px;
		}

		th {
			background: #fdf2e8;
			color: #724f3a;
			font-weight: 700;
		}

		tr.best {
			background: rgba(212, 175, 122, 0.25);
			font-weight: 700;
		}

		.note {
			margin-top: 10px;
			font-size: 13px;
			color: var(--muted);
		}

		.score-breakdown td:last-child,
		.score-breakdown th:last-child {
			text-align: right;
			white-space: nowrap;
			font-weight: 700;
		}

		.error {
			color: var(--bad);
			font-size: 13px;
			margin-top: 6px;
			min-height: 18px;
		}

		@media (min-width: 720px) {
			.input-grid {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}
		}
	</style>
</head>
<body>
	<main class="wrap">
		<section class="hero">
			<h1>Lich Cuoi Hoi</h1>
			<p class="subtitle">Xem ngay gio dep theo phong tuc Viet Nam (tham khao dan gian)</p>
		</section>

		<section class="card">
			<form id="checkForm">
				<div class="input-grid">
					<div>
						<label for="brideDate">Ngay sinh co dau (duong lich)</label>
						<input id="brideDate" type="date" required />
					</div>
					<div>
						<label for="groomDate">Ngay sinh chu re (duong lich)</label>
						<input id="groomDate" type="date" required />
					</div>
					<div>
						<label for="weddingDate">Ngay cuoi du kien (duong lich)</label>
						<input id="weddingDate" type="date" required />
					</div>
				</div>
				<button type="submit">Danh gia ngay cuoi</button>
				<div id="error" class="error"></div>
			</form>
		</section>

		<section id="result" class="result-shell"></section>
	</main>

		function LunarDate(dd, mm, yy, leap, jd) {

			this.month = mm;
			this.year = yy;
			this.leap = leap;
			this.jd = jd;
		}

		function INT(d) {
			return Math.floor(d);
		}

		function jdn(dd, mm, yy) {
			var a = INT((14 - mm) / 12);
			var y = yy + 4800 - a;
			var m = mm + 12 * a - 3;
			return dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;

		function decodeLunarYear(yy, k) {
			var monthLengths = [29, 30];
			var regularMonths = new Array(12);
			var offsetOfTet = k >> 17;
			var leapMonth = k & 0xf;
			var leapMonthLength = monthLengths[(k >> 16) & 0x1];

			var currentJD = solarNY + offsetOfTet;
			var j = k >> 4;
			var i;
			var mm;
			var ly = [];

			for (i = 0; i < 12; i++) {
				regularMonths[12 - i - 1] = monthLengths[j & 0x1];
				j >>= 1;
			}

			if (leapMonth === 0) {
				for (mm = 1; mm <= 12; mm++) {
					ly.push(new LunarDate(1, mm, yy, 0, currentJD));
					currentJD += regularMonths[mm - 1];
				}
			} else {
				for (mm = 1; mm <= leapMonth; mm++) {
					ly.push(new LunarDate(1, mm, yy, 0, currentJD));
					currentJD += regularMonths[mm - 1];
				}
				ly.push(new LunarDate(1, leapMonth, yy, 1, currentJD));
				currentJD += leapMonthLength;
				for (mm = leapMonth + 1; mm <= 12; mm++) {
					ly.push(new LunarDate(1, mm, yy, 0, currentJD));
					currentJD += regularMonths[mm - 1];
				}
			}

			return ly;
		}

		function getYearInfo(yyyy) {

			} else if (yyyy < 2000) {

			} else if (yyyy < 2100) {

			}
			if (THO_TU_THEO_THANG[lunarDate.month] === chiNgay) {
				viPham.push("Thọ Tử");
				delta -= 25;
			}

			return {
				chiNgay: chiNgay,
				viPham: viPham,
				delta: delta
			};
		}

		function xetChiNgayVoiTuoi(chiNgay, chiCoDau, chiChuRe) {
			var delta = 0;
			var lyDo = [];

			if (isPairInList(chiNgay, chiCoDau, LUC_HOP)) {
				delta += 20;
				lyDo.push("Lục hợp với tuổi cô dâu");
			} else if (isXungTrucDien(chiNgay, chiCoDau)) {
				delta -= 30;
				lyDo.push("Chính xung với tuổi cô dâu");
			} else if (isInSameGroup(chiNgay, chiCoDau, TAM_HOP)) {
				delta += 12;
				lyDo.push("Tam hợp với tuổi cô dâu");
			} else if (isPairInList(chiNgay, chiCoDau, LUC_HAI)) {
				delta -= 20;
				lyDo.push("Lục hại với tuổi cô dâu");
			}

			if (isPairInList(chiNgay, chiChuRe, LUC_HOP)) {
				delta += 5;
				lyDo.push("Lục hợp bổ trợ với chú rể");
			} else if (isXungTrucDien(chiNgay, chiChuRe)) {
				delta -= 5;
				lyDo.push("Xung với chú rể");
			}

			return {
				delta: delta,
				lyDo: lyDo
			};
		}

		function danhGiaTheoThuatToan02(input) {
			var score = 100;
			var steps = {};

			steps.buoc1 = {
				ten: "Chuẩn hóa và chuyển đổi âm lịch",
				delta: 0,
				moTa: "Đã chuyển đổi 3 mốc ngày sang âm lịch và trích xuất Can Chi, ngũ hành."
			};

			steps.buoc2 = {
				ten: "Kiểm tra Kim Lâu (cô dâu)",
				delta: input.kimLau.pham ? -100 : 0,
				moTa: input.kimLau.pham
					? ("Phạm " + input.kimLau.loai + " ở tuổi mụ " + input.kimLau.tuoiMu + ". Theo pipeline, đây là bộ lọc quyết định.")
					: ("Không phạm Kim Lâu (tuổi mụ " + input.kimLau.tuoiMu + "), tiếp tục các bước tiếp theo."),
				blocked: input.kimLau.pham
			};

			if (input.kimLau.pham) {
				return {
					score: 0,
					xepLoai: "NGÀY XẤU (HUNG)",
					nhan: "bad",
					steps: steps,
					ketLuanNgan: "Phạm Kim Lâu nên không khuyến nghị chọn ngày này theo thuật toán 5 bước."
				};
			}

			steps.buoc3 = {
				ten: "Lọc ngày đại kỵ",
				delta: input.ngayDaiKy.delta,
				moTa: input.ngayDaiKy.viPham.length
					? ("Phạm: " + input.ngayDaiKy.viPham.join(", ") + ".")
					: "Không phạm Tam Nương, Nguyệt Kỵ, Sát Chủ, Thọ Tử."
			};
			score += input.ngayDaiKy.delta;

			steps.buoc4 = {
				ten: "Xét hợp/xung Địa chi ngày cưới",
				delta: input.chiNgayVsTuoi.delta,
				moTa: input.chiNgayVsTuoi.lyDo.length
					? input.chiNgayVsTuoi.lyDo.join("; ")
					: "Không có hợp/xung nổi bật với tuổi cô dâu/chú rể."
			};
			score += input.chiNgayVsTuoi.delta;

			var deltaNguHanh = 0;
			var lyDoNguHanh = [];
			if (input.nguHanhNgayVsCoDau === "tuong_hoa" || input.nguHanhNgayVsCoDau === "tuong_sinh_nhap" || input.nguHanhNgayVsCoDau === "tuong_sinh_xuat") {
				deltaNguHanh += 15;
				lyDoNguHanh.push("Ngũ hành ngày cưới hài hòa/tương sinh với cô dâu");
			} else if (input.nguHanhNgayVsCoDau === "tuong_khac_nhap") {
				deltaNguHanh -= 25;
				lyDoNguHanh.push("Ngũ hành ngày cưới khắc nhập cô dâu");
			} else if (input.nguHanhNgayVsCoDau === "tuong_khac_xuat") {
				deltaNguHanh -= 15;
				lyDoNguHanh.push("Ngũ hành cô dâu khắc xuất ngày cưới");
			}

			if (input.nguHanhNgayVsChuRe === "tuong_hoa" || input.nguHanhNgayVsChuRe === "tuong_sinh_nhap") {
				deltaNguHanh += 5;
				lyDoNguHanh.push("Ngũ hành ngày cưới hỗ trợ chú rể");
			} else if (input.nguHanhNgayVsChuRe === "tuong_khac_nhap") {
				deltaNguHanh -= 5;
				lyDoNguHanh.push("Ngũ hành ngày cưới khắc chú rể");
			}

			steps.buoc5 = {
				ten: "Xét tương sinh Ngũ hành",
				delta: deltaNguHanh,
				moTa: lyDoNguHanh.length ? lyDoNguHanh.join("; ") : "Quan hệ ngũ hành trung tính."
			};
			score += deltaNguHanh;

			if (score > 100) score = 100;
			if (score < 0) score = 0;

			var xepLoai;
			var nhan;
			if (score >= 80) {
				xepLoai = "NGÀY ĐẸP (CÁT TƯỜNG)";
				nhan = "ok";
			} else if (score >= 50) {
				xepLoai = "NGÀY BÌNH THƯỜNG";
				nhan = "warn";
			} else {
				xepLoai = "NGÀY XẤU (HUNG)";
				nhan = "bad";
			}

			return {
				score: score,
				xepLoai: xepLoai,
				nhan: nhan,
				steps: steps,
				ketLuanNgan: "Đã đánh giá theo pipeline 5 bước: Kim Lâu -> Đại kỵ -> Chi -> Ngũ hành."
			};
		}

		function normalizeChi(raw) {
			var map = {
				"Ty": "Tý",
				"Suu": "Sửu",
				"Dan": "Dần",
				"Mao": "Mão",
				"Thin": "Thìn",
				"Ty_": "Tỵ",
				"Ngo": "Ngọ",
				"Mui": "Mùi",
				"Than": "Thân",
				"Dau": "Dậu",
				"Tuat": "Tuất",
				"Hoi": "Hợi"
			};
			return map[raw] || raw;
		}

		function parseGioHoangDao(raw) {
			var rows = [];
			var regex = /([A-Za-z_]+)\s*\((\d+)-(\d+)\)/g;
			var m;
			while ((m = regex.exec(raw)) !== null) {
				rows.push({
					chi: normalizeChi(m[1]),
					start: parseInt(m[2], 10),
					end: parseInt(m[3], 10)
				});
			}
			return rows;
		}

		function coHopTamLuc(chiA, chiB) {
			return isPairInList(chiA, chiB, LUC_HOP) || isInSameGroup(chiA, chiB, TAM_HOP);
		}

		function xetGioHoangDao(jd, chiNgay, chiCoDau) {
			var ds = parseGioHoangDao(getGioHoangDao(jd));
			var bestIndex = -1;
			var bestRank = -1;

			for (var i = 0; i < ds.length; i++) {
				var gio = ds[i];
				var hopNgay = coHopTamLuc(gio.chi, chiNgay);
				var hopCoDau = coHopTamLuc(gio.chi, chiCoDau);
				var banNgay = (gio.start >= 6 && gio.start < 18) || (gio.end > 6 && gio.end <= 18);
				var rank = 0;

				if (hopNgay && hopCoDau) {
					rank = 3;
				} else if (hopNgay) {
					rank = 2;
				} else if (hopCoDau) {
					rank = 1;
				}

				if (rank === 0 && banNgay) {
					rank = 0.5;
				}

				gio.hopNgay = hopNgay;
				gio.hopCoDau = hopCoDau;
				gio.banNgay = banNgay;

				if (rank > bestRank) {
					bestRank = rank;
					bestIndex = i;
				}
			}

			return {
				danhSach: ds,
				bestIndex: bestIndex
			};
		}

		function chamDiemTongHop(parts) {
			var tong = 0;
			for (var i = 0; i < parts.length; i++) {
				tong += parts[i];
			}
			var xepLoai;
			var nhan;
			if (tong >= 10) {
				xepLoai = "Đại cát";
				nhan = "ok";
			} else if (tong >= 6) {
				xepLoai = "Cát";
				nhan = "ok";
			} else if (tong >= 2) {
				xepLoai = "Trung bình";
				nhan = "warn";
			} else {
				xepLoai = "Hung";
				nhan = "bad";
			}
			return { tong: tong, xepLoai: xepLoai, nhan: nhan };
		}

		/* ===== [PHAN 4] UI LOGIC ===== */
		function fmtDateVN(parts) {
			return parts.d + "/" + parts.m + "/" + parts.y;
		}

		function getThuVN(parts) {
			var d = new Date(parts.y, parts.m - 1, parts.d);
			var thu = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
			return thu[d.getDay()];
		}

		function fmtLunarVN(lunar) {
			return lunar.day + "/" + lunar.month + "/" + lunar.year + (lunar.leap ? " (nhuận)" : "");
		}

		function safeText(s) {
			return String(s)
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#39;");
		}

		function pointTag(score) {
			if (score > 0) {
				return "<span class=\"tag ok\">+" + score + " điểm</span>";
			}
			if (score < 0) {
				return "<span class=\"tag bad\">" + score + " điểm</span>";
			}
			return "<span class=\"tag warn\">0 điểm</span>";
		}

		function formatScoreNumber(score) {
			if (score > 0) {
				return "+" + score;
			}
			return String(score);
		}

		function renderGioTable(ketQuaGio) {
			var rows = "";
			for (var i = 0; i < ketQuaGio.danhSach.length; i++) {
				var g = ketQuaGio.danhSach[i];
				var className = i === ketQuaGio.bestIndex ? "best" : "";
				var note = [];
				if (g.hopNgay) note.push("hợp Chi ngày");
				if (g.hopCoDau) note.push("hợp tuổi cô dâu");
				if (note.length === 0 && g.banNgay) note.push("ưu tiên ban ngày");
				rows += "<tr class=\"" + className + "\"><td>" + g.chi + "</td><td>" + g.start + "h - " + g.end + "h</td><td>" + (note.join(", ") || "hoàng đạo") + "</td></tr>";
			}

			return "<table><thead><tr><th>Chi giờ</th><th>Khung giờ</th><th>Nhận xét</th></tr></thead><tbody>" + rows + "</tbody></table>";
		}

		function renderResult(data) {
			var el = document.getElementById("result");
			var info = data.info;
			var diem = data.diem;
			var goiY = data.goiY.filter(function (x) { return !!x; });

			var html = "";
			html += "<section class=\"card\">";
			html += "<div class=\"grade\">";
			html += "<h2>" + safeText(diem.xepLoai) + "</h2>";
			html += "<div class=\"point-line\">Tổng điểm: " + diem.tong + "/100</div>";
			html += "<span class=\"tag " + diem.nhan + "\">" + safeText(info.nhanXet) + "</span>";
			html += "<div class=\"note\">Ngày cưới dự kiến: " + safeText(info.ngayCuoiDuong) + " | Âm lịch: " + safeText(info.ngayCuoiAm) + "</div>";
			html += "</div>";

			html += "<details open><summary>Giải thích cộng/trừ điểm</summary>";
			html += "<div class=\"detail-body\">";
			html += "<table class=\"score-breakdown\"><thead><tr><th>Bước</th><th>Nội dung</th><th>Điểm</th></tr></thead><tbody>";
			html += "<tr><td>Bước 1</td><td>" + safeText(info.alg02.steps.buoc1.moTa) + "</td><td>" + formatScoreNumber(info.alg02.steps.buoc1.delta) + "</td></tr>";
			html += "<tr><td>Bước 2</td><td>" + safeText(info.alg02.steps.buoc2.moTa) + "</td><td>" + formatScoreNumber(info.alg02.steps.buoc2.delta) + "</td></tr>";
			if (!info.alg02.steps.buoc2.blocked) {
				html += "<tr><td>Bước 3</td><td>" + safeText(info.alg02.steps.buoc3.moTa) + "</td><td>" + formatScoreNumber(info.alg02.steps.buoc3.delta) + "</td></tr>";
				html += "<tr><td>Bước 4</td><td>" + safeText(info.alg02.steps.buoc4.moTa) + "</td><td>" + formatScoreNumber(info.alg02.steps.buoc4.delta) + "</td></tr>";
				html += "<tr><td>Bước 5</td><td>" + safeText(info.alg02.steps.buoc5.moTa) + "</td><td>" + formatScoreNumber(info.alg02.steps.buoc5.delta) + "</td></tr>";
			}
			html += "<tr><td><strong>Kết luận</strong></td><td><strong>" + safeText(info.alg02.ketLuanNgan) + "</strong></td><td><strong>" + formatScoreNumber(diem.tong) + "/100</strong></td></tr>";
			html += "</tbody></table>";
			html += "</div></details>";

			html += "<details open><summary>Thông tin ngày dương/âm và thứ</summary>";
			html += "<div class=\"detail-body\">";
			html += "Cô dâu: " + info.coDauDuong + " (" + info.coDauThu + ") | Âm: " + info.coDauAm + "\n";
			html += "Chú rể: " + info.chuReDuong + " (" + info.chuReThu + ") | Âm: " + info.chuReAm + "\n";
			html += "Ngày cưới: " + info.ngayCuoiDuong + " (" + info.ngayCuoiThu + ") | Âm: " + info.ngayCuoiAm;
			html += "</div></details>";

			html += "<details open><summary>5) Giờ hoàng đạo trong ngày cưới</summary>";
			html += renderGioTable(info.gioHD);
			html += "</details>";

			if (goiY.length) {
				html += "<details><summary>Gợi ý hóa giải dân gian</summary><div class=\"detail-body\">" + safeText(goiY.join("\n")) + "</div></details>";
			}

			html += "<div class=\"note\">Lưu ý: Kết quả mang tính tham khảo theo phong tục dân gian Việt Nam, không thay thế tư vấn cá nhân từ gia đình và người có kinh nghiệm.</div>";
			html += "</section>";

			el.innerHTML = html;
			el.classList.add("show");
		}

		function validateRange(parts) {
			return parts.y >= 1900 && parts.y <= 2099;
		}

		document.getElementById("checkForm").addEventListener("submit", function (e) {
			e.preventDefault();
			var errorEl = document.getElementById("error");
			errorEl.textContent = "";

			var brideRaw = document.getElementById("brideDate").value;
			var groomRaw = document.getElementById("groomDate").value;
			var weddingRaw = document.getElementById("weddingDate").value;

			if (!brideRaw || !groomRaw || !weddingRaw) {
				errorEl.textContent = "Vui lòng nhập đủ 3 ngày.";
				return;
			}

			var bride = toDateParts(brideRaw);
			var groom = toDateParts(groomRaw);
			var wedding = toDateParts(weddingRaw);

			if (!validateRange(bride) || !validateRange(groom) || !validateRange(wedding)) {
				errorEl.textContent = "Phạm vi năm hỗ trợ: 1900-2099.";
				return;
			}

			var lunarBride = getLunarDate(bride.d, bride.m, bride.y);
			var lunarGroom = getLunarDate(groom.d, groom.m, groom.y);
			var lunarWedding = getLunarDate(wedding.d, wedding.m, wedding.y);

			var chiCoDau = getChiNameFromYear(lunarBride.year);
			var chiChuRe = getChiNameFromYear(lunarGroom.year);
			var chiNamCuoi = getChiNameFromYear(lunarWedding.year);
			var canCoDau = getCanNameFromYear(lunarBride.year);
			var canChuRe = getCanNameFromYear(lunarGroom.year);

			var tuoi = xetTuoiVoChong(chiCoDau, chiChuRe);
			var thienCan = xetThienCan(canCoDau, canChuRe);
			var menh = xetCungMenh(lunarBride.year, lunarGroom.year);
			var cungPhi = xetCungPhiVoChong(lunarBride.year, lunarGroom.year);
			var kimLau = xetKimLau(lunarBride.year, lunarWedding.year);
			var hoangOc = xetHoangOc(bride.y, wedding.y);
			var tamTai = xetTamTai(chiCoDau, chiNamCuoi);
			var thangCuoi = xetThangCuoi(chiCoDau, lunarWedding.month);
			var ngayHD = xetNgayHoangDao(lunarWedding);
			var ngayXau = xetNgayXau(lunarWedding);

			var chiNgayCuoi = CHI_VN[(lunarWedding.jd + 1) % 12];
			var gioHD = xetGioHoangDao(lunarWedding.jd, chiNgayCuoi, chiCoDau);

			var tongNamCuoi = kimLau.diem + hoangOc.diem + tamTai.diem;
			var ngayDaiKy = xetNgayDaiKyTheoThang(lunarWedding);
			var chiNgayVsTuoi = xetChiNgayVoiTuoi(chiNgayCuoi, chiCoDau, chiChuRe);
			var nguHanhNgay = getNguHanhNgayByJd(lunarWedding.jd);
			var nguHanhNgayVsCoDau = xetNguHanhNgayVoiMenh(nguHanhNgay.hanh, menh.menhCoDau.hanh);
			var nguHanhNgayVsChuRe = xetNguHanhNgayVoiMenh(nguHanhNgay.hanh, menh.menhChuRe.hanh);

			var alg02 = danhGiaTheoThuatToan02({
				kimLau: kimLau,
				ngayDaiKy: ngayDaiKy,
				chiNgayVsTuoi: chiNgayVsTuoi,
				nguHanhNgayVsCoDau: nguHanhNgayVsCoDau,
				nguHanhNgayVsChuRe: nguHanhNgayVsChuRe
			});

			var tong = {
				tong: alg02.score,
				xepLoai: alg02.xepLoai,
				nhan: alg02.nhan
			};

			var nhanXet = alg02.ketLuanNgan;

			renderResult({
				diem: tong,
				goiY: [kimLau.goiY, tamTai.goiY],
				info: {
					nhanXet: nhanXet,
					coDauDuong: fmtDateVN(bride),
					coDauThu: getThuVN(bride),
					coDauAm: fmtLunarVN(lunarBride),
					chuReDuong: fmtDateVN(groom),
					chuReThu: getThuVN(groom),
					chuReAm: fmtLunarVN(lunarGroom),
					ngayCuoiDuong: fmtDateVN(wedding),
					ngayCuoiThu: getThuVN(wedding),
					ngayCuoiAm: fmtLunarVN(lunarWedding),
					chiCoDau: chiCoDau,
					chiChuRe: chiChuRe,
					chiNamCuoi: chiNamCuoi,
					canCoDau: canCoDau,
					canChuRe: canChuRe,
					tuoi: tuoi,
					thienCan: thienCan,
					menh: menh,
					cungPhi: cungPhi,
					menhCoDauText: getCanNameFromYear(lunarBride.year) + " " + chiCoDau + " - " + menh.menhCoDau.napAm + " (" + menh.menhCoDau.hanh + ")",
					menhChuReText: getCanNameFromYear(lunarGroom.year) + " " + chiChuRe + " - " + menh.menhChuRe.napAm + " (" + menh.menhChuRe.hanh + ")",
					kimLau: kimLau,
					hoangOc: hoangOc,
					tamTai: tamTai,
					thangCuoi: thangCuoi,
					ngayHD: ngayHD,
					ngayXau: ngayXau,
					gioHD: gioHD,
					alg02: alg02,
					ngayDaiKy: ngayDaiKy,
					chiNgayVsTuoi: chiNgayVsTuoi,
					nguHanhNgay: nguHanhNgay,
					namCuoiTongDiem: tongNamCuoi
				}
			});
		});
	</script>
